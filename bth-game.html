<title>BEYOND THE HORIZON · PLAYABLE 1.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142019;color:#eef3e8;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

.panel{background:#07110dcc;border:1px solid #ffffff22;border-radius:14px;padding:9px 11px;backdrop-filter:blur(6px);font-size:12px;line-height:1.35}

button:active{transform:scale(.96);background:#233d2c}

<canvas id="c"></canvas>
<div id="top"><div class="panel"><b>BEYOND THE HORIZON</b><br>PLAYABLE 0.6 · день <span id="day">1</span> · <span id="clock">08:00</span><br><span id="weather">ясно</span> · <span id="wt">12°C</span></div>
<div class="panel">HP <span id="hp">100</span> · Вода <span id="water">80</span> · Еда <span id="food">80</span> · Энергия <span id="energy">100</span></div></div>

<div id="joy"><div id="knob"></div></div>
<div id="actions">
<button id="act">Собрать</button><button id="eat">Есть</button>
<button id="drink">Пить</button><button id="fire">Огонь</button>
<button id="craft">Крафт</button><button id="sleep">Сон</button>
<button id="inv">Инвентарь</button><button id="save">Сохранить</button>
</div>
<div id="sheet"><div class="sheetin"><button class="close" id="close">×</button><h2 id="sheetTitle">Инвентарь</h2><div id="sheetBody"></div></div></div>
<script>
'use strict';
const C=document.getElementById('c'),ctx=C.getContext('2d',{alpha:false});let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

const KEY='bth05-save';
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let S={x:0,y:0,day:1,minutes:480,hp:100,water:80,food:80,energy:100,temp:37,
inv:{wood:0,stone:0,berry:0,rawmeat:0,cooked:0,water:0,fuel:0},
tools:{knife:false,axe:false,shelter:false,fire:false},known:[],memory:[],
weather:{type:'ясно',temp:12,wind:0.2,humidity:0.45},world:[],animals:[]};
S.version='1.0';
S.items={};
S.knowledge={};
S.ecology={};
S.events=[];
S.stats={distance:0,resourcesGathered:0,daysSurvived:0};



/* ===== BEYOND THE HORIZON 1.0 SYSTEMS ===== */
const MAT={
 wood:{hardness:.35,strength:.45,flexibility:.55,flammability:.85},
 stone:{hardness:.90,strength:.80,flexibility:.08,flammability:.02},
 fiber:{hardness:.10,strength:.30,flexibility:.90,flammability:.70},
 meat:{hardness:.05,strength:.08,flexibility:.70,flammability:.15}
};
function sanitizeState10(){
  ensure10();
  if(!Array.isArray(S.world))S.world=[];
  if(!Array.isArray(S.animals))S.animals=[];
  if(!Array.isArray(S.memory))S.memory=[];
  if(!Array.isArray(S.known))S.known=[];
  if(!Array.isArray(S.events))S.events=[];
  if(typeof S.x!=='number'||!Number.isFinite(S.x))S.x=0;
  if(typeof S.y!=='number'||!Number.isFinite(S.y))S.y=0;
  if(typeof S.day!=='number'||!Number.isFinite(S.day)||S.day<1)S.day=1;
  if(typeof S.minutes!=='number'||!Number.isFinite(S.minutes))S.minutes=480;
  S.minutes=((S.minutes%1440)+1440)%1440;
  for(const k of ['hp','water','food','energy']){
    if(typeof S[k]!=='number'||!Number.isFinite(S[k]))S[k]=80;
    S[k]=Math.max(0,Math.min(100,S[k]));
  }
  if(!S.weather||typeof S.weather!=='object')S.weather={type:'ясно',temp:12,wind:.2,humidity:.45};
  if(typeof S.weather.temp!=='number')S.weather.temp=12;
  if(typeof S.weather.wind!=='number')S.weather.wind=.2;
  if(typeof S.weather.humidity!=='number')S.weather.humidity=.45;
}

function ensure10(){
 if(!S.version)S.version='1.0';
 if(!S.items)S.items={}; if(!S.knowledge)S.knowledge={};
 if(!S.ecology)S.ecology={}; if(!S.events)S.events=[];
 if(!S.stats)S.stats={distance:0,resourcesGathered:0,daysSurvived:0};
 for(const k of ['wood','stone','berry','rawmeat','cooked','water','fuel']) if(typeof S.inv[k]!=='number')S.inv[k]=0;
}
ensure10();

function materialState(material,o){
 const m=MAT[material]||{};
 return {
   material, hardness:m.hardness??0, strength:m.strength??0,
   flexibility:m.flexibility??0, flammability:m.flammability??0,
   wet:Math.max(0,Math.min(1,o?.wet||0)),
   condition:Math.max(0,Math.min(1,o?.condition??1)),
   history:o?.history||[]
 };
}
function itemWear(name,amount){
 if(!S.items[name])S.items[name]={condition:1,uses:0,material:name};
 const it=S.items[name]; it.uses=(it.uses||0)+amount;
 it.condition=Math.max(0,it.condition-amount*.0025);
 if(it.condition<.15) remember('Инструмент '+name+' сильно изношен.');
}
function observe(key,state,text){
 const rank=S.knowledge[key]||'UNKNOWN';
 const next={UNKNOWN:'OBSERVED',OBSERVED:'TESTED',TESTED:'MASTERED',MASTERED:'MASTERED'}[rank];
 if(next&&next!==rank){S.knowledge[key]=next;discover(text+' ['+next+']');}
}
function ecologyStep(step){
 const regen=Math.min(.08,step/3600);
 for(const o of S.world){
   if(o.type==='berry') o.amount=Math.min(3,o.amount+regen*(o.wet>.2?1.4:.7));
   if(o.type==='tree') o.amount=Math.min(6,o.amount+regen*.12);
   if(o.type==='pond') o.amount=1;
   if(o.wet>0)o.wet=Math.max(0,o.wet-step*.0008);
 }
 for(const a of S.animals){
   if(a.kind==='deer' && Math.random()<step/5000)a.fear=Math.max(0,a.fear-1);
 }
}
function eventStep(step){
 // Causal, persistent world memory: only record an event when its state changes.
 if(!S.events)S.events=[];
 const wet=S.weather.type==='дождь';
 const key='rain_'+S.day;
 if(wet && !S.events.some(e=>e.key===key)){
   S.events.push({key,type:'weather',day:S.day,text:'Сильные осадки изменили состояние местности.'});
   remember('Мир: после дождя поверхность и растительность стали влажнее.');
 }
 if(S.tools.fire && Math.random()<step*.00015){
   const key2='fire_'+S.day+'_'+Math.floor(S.minutes/60);
   if(!S.events.some(e=>e.key===key2)){
     S.events.push({key:key2,type:'fire',day:S.day,text:'Очаг требует топлива и внимания.'});
     remember('Мир: огонь требует ресурсов и контроля.');
   }
 }
 if(S.events.length>120)S.events.splice(0,S.events.length-120);
}
function worldMemoryFor(o,action){
 if(!o.history)o.history=[];
 o.history.push({day:S.day,minute:S.minutes,action});
 if(o.history.length>20)o.history.shift();
}


/* ===== BTH 1.1: MATERIALS / CONDITION / FIELD SCIENCE ===== */
const BTH11_MAT={
 wood:{hardness:.35,strength:.45,flexibility:.55,flammability:.85,density:.55},
 stone:{hardness:.90,strength:.80,flexibility:.08,flammability:.02,density:.90},
 fiber:{hardness:.10,strength:.30,flexibility:.90,flammability:.70,density:.25},
 meat:{hardness:.05,strength:.08,flexibility:.70,flammability:.15,density:.30}
};
function bth11Material(name, condition, wet, history){
 const m=BTH11_MAT[name]||{};
 return {name,hardness:m.hardness??0,strength:m.strength??0,
   flexibility:m.flexibility??0,flammability:m.flammability??0,
   density:m.density??0,condition:Math.max(0,Math.min(1,condition??1)),
   wet:Math.max(0,Math.min(1,wet??0)),history:history||[]};
}
function bth11ConditionText(v){
 return v>.8?'хорошее':v>.55?'нормальное':v>.3?'изношенное':'критическое';
}
function bth11RecordObject(o,action){
 if(!o.history)o.history=[];
 o.history.push({day:S.day,minute:S.minutes,action});
 if(o.history.length>24)o.history.shift();
}
function bth11UseTool(name,uses){
 if(!S.items[name])S.items[name]={material:name==='axe'?'wood':'stone',condition:.75,uses:0};
 S.items[name].uses=(S.items[name].uses||0)+uses;
 S.items[name].condition=Math.max(0,(S.items[name].condition??1)-uses*.003);
 if(S.items[name].condition<=0){
   S.tools[name]=false;
   delete S.items[name];
   remember('Инструмент '+name+' сломался после износа.');
   toast('Сломано: '+name);
 }
}
function bth11FieldObservation(){
 const near=S.world.filter(o=>Math.hypot(o.x-S.x,o.y-S.y)<95);
 if(!near.length){toast('Рядом нечего исследовать');return}
 const o=near[0], m=bth11Material(o.type==='tree'?'wood':o.type==='rock'?'stone':o.type==='berry'?'fiber':'water',o.condition??1,o.wet??0,o.history);
 const key='field_'+o.type;
 const level=S.knowledge[key]||'UNKNOWN';
 const next={UNKNOWN:'OBSERVED',OBSERVED:'TESTED',TESTED:'MASTERED',MASTERED:'MASTERED'}[level];
 S.knowledge[key]=next;
 remember('Исследование: '+o.type+' · состояние '+bth11ConditionText(m.condition));
 if(typeof discover==='function')discover('Полевое наблюдение: '+o.type);
 toast('Наблюдение записано');
}


/* ===== BTH 1.2: CAUSAL ENVIRONMENT ===== */
const BTH12={
 material(name,o){
  const base=(typeof BTH11_MAT==='object'&&BTH11_MAT[name])||{hardness:.5,strength:.5,flexibility:.5,flammability:.5,density:.5};
  const wet=Math.max(0,Math.min(1,o?.wet||0));
  const cond=Math.max(0,Math.min(1,o?.condition??1));
  return {...base,wet,condition:cond,
    effectiveStrength:Math.max(.02,base.strength*cond*(1-wet*.45)),
    effectiveHardness:Math.max(.02,base.hardness*cond*(1-wet*.25)),
    effectiveFlammability:base.flammability*(1-wet*.75)};
 },
 action(tool,object,method){
  const m=this.material(object.type==='tree'?'wood':object.type==='rock'?'stone':object.type==='berry'?'fiber':'water',object);
  let skill=0.45;
  if(tool==='axe'&&S.tools.axe)skill=.8;
  if(tool==='knife'&&S.tools.knife)skill=.7;
  const precision=.7+Math.random()*.3;
  const difficulty=Math.max(.1,m.effectiveHardness);
  const success=Math.min(.98,Math.max(.05,(skill*precision)/(difficulty+0.25)));
  return {success,m,quality:Math.min(1,success*precision)};
 },
 climate(step){
  const w=S.weather||{};
  for(const o of S.world){
   if(o.type==='tree'||o.type==='berry'){
    if(w.type==='дождь'||w.humidity>.72)o.wet=Math.min(1,(o.wet||0)+step*.002);
    else o.wet=Math.max(0,(o.wet||0)-step*.0005);
   }
  }
 },
 recordCause(cause,effect){
  if(!S.causes)S.causes=[];
  S.causes.push({day:S.day,minute:S.minutes,cause,effect});
  if(S.causes.length>80)S.causes.shift();
 },
 decay(step){
  for(const k of Object.keys(S.items||{})){
   const it=S.items[k];
   if(it && it.condition!=null && S.weather?.type==='дождь')
    it.condition=Math.max(0,it.condition-step*.00005);
  }
 }
};
if(!S.causes)S.causes=[];


/* ===== BTH 1.3: LIVING BIOLOGY ===== */
const BTH13={
 ensure(){
  if(!S.bio)S.bio={season:0,plantSeeds:0,animalBirths:0,animalDeaths:0,predation:0};
  if(!S.world)return;
  for(const o of S.world){
   if((o.type==='tree'||o.type==='berry') && o.bio==null)o.bio={age:1,health:1,repro:0};
   if(o.type==='animal' && o.bio==null)o.bio={age:1,health:1,hunger:0,thirst:0,energy:1,repro:0};
  }
 },
 season(){
  return Math.floor((((S.day||1)-1)%120)/30);
 },
 plant(step){
  this.ensure();
  const season=this.season();
  S.bio.season=season;
  for(const o of S.world){
   if(o.type!=='tree'&&o.type!=='berry')continue;
   o.bio.age+=step/86400;
   const rain=(S.weather?.type==='дождь'||S.weather?.humidity>.65)?1.15:0.9;
   o.bio.health=Math.max(0,Math.min(1,o.bio.health+step/86400*.002*rain));
   o.bio.repro=Math.min(1,o.bio.repro+step/86400*(season===2?.012:.006));
   if(o.bio.repro>.95 && Math.random()<step/86400*.08 && S.world.length<260){
    S.world.push({type:o.type,x:o.x+(Math.random()-.5)*55,y:o.y+(Math.random()-.5)*55,
      amount:o.type==='tree'?2:3,wet:o.wet||0,condition:1,
      bio:{age:0,health:.8,repro:0}});
    o.bio.repro=0; S.bio.plantSeeds++;
    if(typeof BTH12?.recordCause==='function')BTH12.recordCause('размножение растения','новый '+o.type);
   }
  }
 },
 animals(step){
  this.ensure();
  for(const o of S.world){
   if(o.type!=='animal')continue;
   const b=o.bio;
   b.age+=step/86400;
   b.hunger=Math.min(1,b.hunger+step/86400*.035);
   b.thirst=Math.min(1,b.thirst+step/86400*.045);
   b.energy=Math.max(0,b.energy-step/86400*.018);
   if(b.hunger>.75)b.health=Math.max(0,b.health-step/86400*.025);
   if(b.thirst>.8)b.health=Math.max(0,b.health-step/86400*.035);
   if(b.health<.05 && Math.random()<step/86400*.4){
    o.dead=true;S.bio.animalDeaths++;
    if(typeof BTH12?.recordCause==='function')BTH12.recordCause('дефицит ресурсов животного','гибель животного');
   }
   if(b.hunger<.45 && b.health>.5)b.repro=Math.min(1,b.repro+step/86400*.008);
  }
  for(const a of S.world.filter(o=>o.type==='animal'&&!o.dead)){
   if(a.bio.repro>.95 && Math.random()<step/86400*.06 && S.world.length<260){
    S.world.push({type:'animal',x:a.x+(Math.random()-.5)*45,y:a.y+(Math.random()-.5)*45,
      amount:1,condition:1,bio:{age:0,health:.9,hunger:.1,thirst:.1,energy:1,repro:0}});
    a.bio.repro=0;S.bio.animalBirths++;
    if(typeof BTH12?.recordCause==='function')BTH12.recordCause('размножение животного','рождение потомства');
   }
  }
 },
 ecosystem(step){
  this.ensure();
  // Herbivory: nearby animals consume plant biomass.
  for(const a of S.world.filter(o=>o.type==='animal'&&!o.dead)){
   if(a.bio.hunger<.5)continue;
   let best=null,dist=Infinity;
   for(const p of S.world){
    if(p.type!=='berry'&&p.type!=='tree')continue;
    const d=Math.hypot(p.x-a.x,p.y-a.y);
    if(d<dist&&d<90&&p.amount>0){best=p;dist=d;}
   }
   if(best){
    best.amount=Math.max(0,best.amount-step*.004);
    a.bio.hunger=Math.max(0,a.bio.hunger-step*.018);
    a.bio.energy=Math.min(1,a.bio.energy+step*.006);
    if(best.amount<=0)best.bio.health=Math.max(0,best.bio.health-.08);
   }
  }
  S.world=S.world.filter(o=>!o.dead&&!(o.amount!=null&&o.amount<=0&&o.type==='animal'));
 }
};
BTH13.ensure();

function sanitizeState13(){
 if(!S.bio)S.bio={season:0,plantSeeds:0,animalBirths:0,animalDeaths:0,predation:0};
 if(!Array.isArray(S.world))S.world=[];
 for(const o of S.world){
  if((o.type==='tree'||o.type==='berry')&&(!o.bio||typeof o.bio!=='object'))
   o.bio={age:1,health:1,repro:0};
  if(o.type==='animal'&&(!o.bio||typeof o.bio!=='object'))
   o.bio={age:1,health:1,hunger:.2,thirst:.2,energy:1,repro:0};
 }
}


/* ===== BEYOND THE HORIZON 3.0 — WORLD SIMULATION CORE ===== */
const BTH30={
 VERSION:'3.0',
 init(){
  S.version='3.0';
  if(!S.worldSeed)S.worldSeed=Math.floor(Math.random()*2147483647);
  if(!S.history)S.history=[];
  if(!S.discoveries)S.discoveries=[];
  if(!S.relationships)S.relationships=[];
  if(!S.npc)S.npc={population:0,settlements:0,knowledge:0};
  if(!S.routes)S.routes=[];
  if(!S.expeditions)S.expeditions=[];
  if(!S.infrastructure)S.infrastructure={camp:0,shelter:0,workbench:0};
  if(!S.sim)S.sim={hours:0,days:0,years:0};
  this.migrate();
 },
 migrate(){
  if(!Array.isArray(S.world))S.world=[];
  for(const o of S.world){
   if(o.condition==null)o.condition=1;
   if(o.history==null)o.history=[];
   if(o.type==='animal'&&o.bio==null)o.bio={age:1,health:1,hunger:.2,thirst:.2,energy:1,repro:0};
  }
 },
 log(type,data){
  S.history.push({day:S.day||1,minute:S.minutes||0,type,data});
  if(S.history.length>500)S.history.shift();
 },
 advance(hours){
  if(!Number.isFinite(hours)||hours<=0)return;
  S.sim.hours+=hours;
  while(S.sim.hours>=24){S.sim.hours-=24;S.sim.days++;this.daily();}
 },
 daily(){this.worldMemory();this.settlementDrift();},
 worldMemory(){
  const animals=(S.world||[]).filter(o=>o.type==='animal'&&!o.dead).length;
  const plants=(S.world||[]).filter(o=>o.type==='tree'||o.type==='berry').length;
  this.log('world_snapshot',{animals,plants,day:S.day||1});
 },
 settlementDrift(){
  const food=Math.max(0,S.food||0),water=Math.max(0,S.water||0);
  if(food>70&&water>70)S.npc.population=Math.min(20,(S.npc.population||0)+.02);
  if(food<15||water<15)S.npc.population=Math.max(0,(S.npc.population||0)-.04);
  S.npc.settlements=S.npc.population>=5?1:0;
 },
 discover(name,kind){
  if(!S.discoveries.some(d=>d.name===name)){
   S.discoveries.push({name,kind,day:S.day||1,confidence:'observed'});
   this.log('discovery',{name,kind});
  }
 },
 routeTo(x,y){
  if(!Number.isFinite(x)||!Number.isFinite(y))return;
  const last=S.routes[S.routes.length-1];
  if(!last||Math.hypot(last.x-x,last.y-y)>35)S.routes.push({x,y,uses:1,day:S.day||1});
  else last.uses++;
 },
 action(name,consequence){this.log('player_action',{name,consequence});},
 status(){
  return {version:this.VERSION,day:S.day||1,
   animals:(S.world||[]).filter(o=>o.type==='animal'&&!o.dead).length,
   plants:(S.world||[]).filter(o=>o.type==='tree'||o.type==='berry').length,
   discoveries:(S.discoveries||[]).length,history:(S.history||[]).length};
 }
};
BTH30.init();

function makeWorld(){
 S.world=[];S.animals=[];
 const types=['tree','tree','tree','rock','berry','berry','pond','ruin'];
 for(let i=0;i<130;i++){let a=rnd(0,Math.PI*2),r=Math.sqrt(Math.random())*1800;
  let type=types[Math.floor(Math.random()*types.length)];
  S.world.push({x:Math.cos(a)*r,y:Math.sin(a)*r,type,amount:type==='tree'?rnd(2,6):type==='rock'?rnd(1,4):type==='berry'?rnd(1,3):1,condition:rnd(.65,1),wet:0,history:[]});
 }
 for(let i=0;i<22;i++){let a=rnd(0,Math.PI*2),r=rnd(180,1700);S.animals.push({x:Math.cos(a)*r,y:Math.sin(a)*r,dx:rnd(-1,1),dy:rnd(-1,1),fear:0,kind:Math.random()<.65?'deer':'wolf'});}
}
function save(){S.version='1.0';localStorage.setItem(KEY,JSON.stringify(S));toast('Сохранено · версия 1.0')}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v){S=v;toast('Сохранение загружено');return}}catch(e){}makeWorld()}
load(); sanitizeState10(); sanitizeState13(); BTH30.migrate();
if(!S.world?.length)makeWorld();
if(!S.weather)S.weather={type:'ясно',temp:12,wind:.2,humidity:.45};
if(!S.memory)S.memory=[];
if(!S.items.knife&&S.tools.knife)S.items.knife={material:'stone',condition:.7,uses:0};
if(!S.items.axe&&S.tools.axe)S.items.axe={material:'stone',condition:.7,uses:0};


const input={x:0,y:0};let joyId=null;
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
function setJoy(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.min(54,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);input.x=Math.cos(a)*(m/54);input.y=Math.sin(a)*(m/54);knob.style.transform=`translate(${input.x*54}px,${input.y*54}px)`}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e);e.preventDefault()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e);e.preventDefault()});
function endJoy(e){if(e.pointerId===joyId){joyId=null;input.x=input.y=0;knob.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);

let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
function toast(t){let m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.opacity=0,1600)}
function clock(){let h=Math.floor(S.minutes/60)%24,m=Math.floor(S.minutes%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function nearby(type,max=72){let best=null,bd=max;for(let o of S.world)if(o.type===type){let d=dist(S,o);if(d<bd&&o.amount>0){best=o;bd=d}}return best}
function collect(){
 let types=[['tree','wood'],['rock','stone'],['berry','berry']];
 for(let [t,k] of types){let o=nearby(t);if(o){
   const act=BTH12.action(t==='tree'?'axe':'knife',o,'collect');
   if(!act.success){toast('Не удалось эффективно обработать ресурс');BTH12.recordCause('попытка сбора '+t,'неудачный результат');return}
   let n=Math.max(1,Math.min(Math.floor(o.amount),t==='tree'&&S.tools.axe?2:1));
   if(act.quality<.45)n=1;
   if(t==='tree'&&!S.tools.axe)n=1;
   S.inv[k]+=n;o.amount=Math.max(0,o.amount-n);worldMemoryFor(o,'сбор');
   S.stats.resourcesGathered=(S.stats.resourcesGathered||0)+n;
   BTH12.recordCause('сбор '+t,'ресурс изменён: '+k+' × '+n);
   if(t==='tree'&&S.tools.axe)itemWear('axe',n);
   else if(t==='rock'&&S.tools.knife)itemWear('knife',n*.3);
   observe(k,materialState(k,o),'Наблюдение: '+k+' имеет изменяемое состояние');
   remember('Извлечён ресурс: '+k+' × '+n);
   toast('Получено: '+k+' × '+n);return}}
 let a=S.animals.find(a=>dist(S,a)<70);if(a&&a.kind==='deer'){S.inv.rawmeat++;toast('Получено: сырое мясо ×1');return}
 toast('Рядом нечего собрать');
}
function eat(){if(S.inv.cooked>0){S.inv.cooked--;S.food=Math.min(100,S.food+35);toast('Приготовленная еда восстановила силы')}else if(S.inv.berry>0){S.inv.berry--;S.food=Math.min(100,S.food+8);toast('Съедены ягоды')}else toast('Нет еды')}
function drink(){let p=nearby('pond',100);if(p){S.water=Math.min(100,S.water+30);toast('Напился из водоёма')}else if(S.inv.water>0){S.inv.water--;S.water=Math.min(100,S.water+35);toast('Выпита вода')}else toast('Нет безопасной воды рядом')}
function makeFire(){if(S.tools.fire){toast('Очаг уже есть');return}if(S.inv.wood>=3&&S.inv.stone>=2){S.inv.wood-=3;S.inv.stone-=2;S.tools.fire=true;toast('Создан очаг')}else toast('Нужно 3 дерева и 2 камня')}
function craft(){
 if(!S.tools.knife&&S.inv.stone>=2&&S.inv.wood>=1){
 S.inv.stone-=2;S.inv.wood--;S.tools.knife=true;S.items.knife={material:'stone',condition:.82,uses:0};
 observe('knife','TESTED','Получен рабочий режущий инструмент');toast('Создан нож');return}
 if(!S.tools.axe&&S.tools.knife&&S.inv.stone>=2&&S.inv.wood>=2){
 S.inv.stone-=2;S.inv.wood-=2;S.tools.axe=true;S.items.axe={material:'stone',condition:.88,uses:0};
 observe('axe','TESTED','Создан инструмент для обработки древесины');toast('Создан топор');return}
 if(!S.tools.shelter&&S.inv.wood>=8){S.inv.wood-=8;S.tools.shelter=true;toast('Построено укрытие');return}
 if(S.inv.rawmeat>0&&S.tools.fire){S.inv.rawmeat--;S.inv.cooked++;toast('Мясо приготовлено');return}
 toast('Пока нечего создавать');
}
function sleep(){let h=S.tools.shelter?8:4;S.minutes=(S.minutes+h*60)%1440;S.day++;S.stats.daysSurvived=(S.stats.daysSurvived||0)+1;S.energy=Math.min(100,S.energy+70);S.food=Math.max(0,S.food-10);S.water=Math.max(0,S.water-10);toast('Проснулся. Мир продолжал жить без тебя.')}
function openSheet(title,body){document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=body;document.getElementById('sheet').classList.add('show')}
function inv(){openSheet('Инвентарь',Object.entries(S.inv).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('')+
`<h3>Инструменты</h3>`+Object.entries(S.tools).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v?'есть':'нет'}</b></div>`).join('')+
`<h3>Состояние инструментов</h3>`+
(Object.entries(S.items||{}).map(([k,v])=>`<div class="row"><span>${k}</span><b>${Math.round((v.condition||0)*100)}%</b></div>`).join('')||'<div class="small">Инструменты ещё не изготовлены.</div>')+
`<h3>Знания</h3>`+
(Object.entries(S.knowledge||{}).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('')||'<div class="small">Наблюдения ещё не накоплены.</div>')+
`<h3>Память мира</h3>`+(S.memory?.slice(-8).map(x=>`<div class="row"><span>День ${x.day}</span><span>${x.text}</span></div>`).join('')||'<div class="small">История пока пуста.</div>'))}
document.getElementById('act').onclick=collect;document.getElementById('eat').onclick=eat;document.getElementById('drink').onclick=drink;document.getElementById('fire').onclick=makeFire;document.getElementById('craft').onclick=craft;document.getElementById('sleep').onclick=sleep;document.getElementById('inv').onclick=inv;document.getElementById('save').onclick=save;document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('show');

let last=performance.now(),sim=0;

function remember(text){
 if(!S.memory)S.memory=[];
 S.memory.push({day:S.day,minute:S.minutes,text});
 if(S.memory.length>80)S.memory.shift();
}
function weatherStep(){
 let r=Math.random();
 if(r<.08)S.weather.type='дождь';
 else if(r<.15)S.weather.type='ветер';
 else if(r<.19)S.weather.type='туман';
 else if(r<.22)S.weather.type='снег';
 else S.weather.type='ясно';
 S.weather.wind=Math.max(.05,Math.min(1.2,S.weather.wind+rnd(-.12,.12)));
 S.weather.humidity=Math.max(.2,Math.min(1,S.weather.humidity+rnd(-.08,.08)));
 S.weather.temp=Math.max(-12,Math.min(26,S.weather.temp+rnd(-2,2)));
}
function discover(text){
 if(!S.known.includes(text)){S.known.push(text);remember('Открытие: '+text);toast('Наблюдение: '+text)}
}
function environmentalStep(dt){
 if(!S.weather)S.weather={type:'ясно',temp:12,wind:.2,humidity:.45};
 if(S.weather.type==='дождь'){
   for(let o of S.world) if(o.type==='tree' || o.type==='berry') o.wet=Math.min(1,o.wet+dt*.01);
   if(S.tools.fire){S.tools.fire=Math.random()<dt*.008?false:S.tools.fire}
 }
 if(S.weather.type==='снег') S.temp=Math.max(34,S.temp-dt*.004);
 else if(S.tools.fire && dist(S,{x:S.x,y:S.y})<130) S.temp=Math.min(37,S.temp+dt*.008);
 if(S.weather.type==='ветер') S.energy=Math.max(0,S.energy-dt*.012);
}

function vitalConsequences(step){
  if(S.water<=0 || S.food<=0) S.hp=Math.max(0,S.hp-step*.015);
  if(S.energy<=0) S.hp=Math.max(0,S.hp-step*.006);
  if(S.temp<34 || S.temp>39) S.hp=Math.max(0,S.hp-step*.01);
  if(S.hp<=0){
    S.hp=35; S.food=Math.max(S.food,20); S.water=Math.max(S.water,20);
    S.energy=Math.max(S.energy,20);
    remember('Потеря сознания: организм достиг критического состояния.');
    toast('Критическое состояние');
  }
}

function update(dt){
 let kx=(keys['d']?1:0)-(keys['a']?1:0),ky=(keys['s']?1:0)-(keys['w']?1:0);
 let ix=Math.abs(input.x)+Math.abs(input.y)?input.x:kx,iy=Math.abs(input.x)+Math.abs(input.y)?input.y:ky;
 let mag=Math.hypot(ix,iy)||1,speed=2.4*(S.energy>5?1:.45);S.x+=ix/mag*speed*dt*60;S.y+=iy/mag*speed*dt*60;
 const oldx=S.x,oldy=S.y;
 S.minutes=(S.minutes+dt*0.7)%1440; S.stats.distance=(S.stats.distance||0)+Math.hypot(S.x-oldx,S.y-oldy); sim+=dt;
 if(sim>=10){
   const step=sim; sim=0;
   weatherStep(); environmentalStep(step);
   S.food=Math.max(0,S.food-step*.08);
   S.water=Math.max(0,S.water-step*.12);
   S.energy=Math.max(0,S.energy-(Math.abs(ix)+Math.abs(iy))*step*1.3);
   vitalConsequences(step);
   BTH30.advance(step/3600);
   BTH30.routeTo(S.x,S.y);
   BTH12.climate(step); BTH12.decay(step);
   ecologyStep(step);
   BTH13.plant(step); BTH13.animals(step); BTH13.ecosystem(step);
   eventStep(step);
   for(let a of S.animals){
     let d=dist(S,a);
     if(d<170)a.fear=Math.min(10,a.fear+step/10);
     else a.fear=Math.max(0,a.fear-step*.015);
     let ang=a.fear>0?Math.atan2(a.y-S.y,a.x-S.x):Math.atan2(a.dy,a.dx);
     a.dx=Math.cos(ang); a.dy=Math.sin(ang);
     a.x+=a.dx*step*1.8; a.y+=a.dy*step*1.8;
   }
 }
}
function draw(){
 ctx.fillStyle=S.weather?.type==='туман'?'#6d796d':S.weather?.type==='снег'?'#80908c':'#5f7f58';ctx.fillRect(0,0,W,H);
 if(S.weather?.type==='дождь'){ctx.strokeStyle='#ffffff35';ctx.lineWidth=1;for(let i=0;i<70;i++){let x=(i*97+(S.minutes*3))%W,y=(i*53)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+14);ctx.stroke()}}
 if(S.weather?.type==='снег'){ctx.fillStyle='#ffffffaa';for(let i=0;i<60;i++){let x=(i*71)%W,y=(i*43+(S.minutes*2))%H;ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill()}}
 let camx=S.x,camy=S.y;
 for(let o of S.world){let sx=W/2+o.x-camx,sy=H/2+o.y-camy;if(sx<-60||sx>W+60||sy<-60||sy>H+60||o.amount<=0)continue;
  ctx.save();ctx.translate(sx,sy);
  if(o.type==='tree'){ctx.fillStyle='#3a291b';ctx.fillRect(-5,5,10,26);ctx.fillStyle='#234b2b';ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill()}
  if(o.type==='rock'){ctx.fillStyle='#77756a';ctx.beginPath();ctx.ellipse(0,6,19,12,0,0,7);ctx.fill()}
  if(o.type==='berry'){ctx.fillStyle='#2c642f';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();ctx.fillStyle='#8d3550';ctx.beginPath();ctx.arc(-5,-2,3,0,7);ctx.arc(5,2,3,0,7);ctx.fill()}
  if(o.type==='pond'){ctx.fillStyle='#3c7180';ctx.beginPath();ctx.ellipse(0,0,50,32,0,0,7);ctx.fill()}
  if(o.type==='ruin'){ctx.strokeStyle='#6e6453';ctx.lineWidth=7;ctx.strokeRect(-24,-18,48,36)}
  ctx.restore()
 }
 for(let a of S.animals){let sx=W/2+a.x-camx,sy=H/2+a.y-camy;if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;ctx.fillStyle=a.kind==='wolf'?'#4a4b4d':'#9a754e';ctx.beginPath();ctx.ellipse(sx,sy,16,9,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.fillText(a.kind==='wolf'?'волк':'олень',sx-14,sy-14)}
 ctx.fillStyle='#e8d2a1';ctx.beginPath();ctx.arc(W/2,H/2,11,0,7);ctx.fill();ctx.strokeStyle='#33291e';ctx.lineWidth=3;ctx.stroke();
 document.getElementById('day').textContent=S.day;document.getElementById('clock').textContent=clock();
 document.getElementById('hp').textContent=Math.round(S.hp);document.getElementById('water').textContent=Math.round(S.water);document.getElementById('food').textContent=Math.round(S.food);document.getElementById('energy').textContent=Math.round(S.energy);
 document.getElementById('weather').textContent=S.weather?.type||'ясно';document.getElementById('wt').textContent=Math.round(S.weather?.temp||12)+'°C';
}
function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function bth11HUD(){
 const c=document.getElementById('canvas'); if(!c)return;
 const ctx=c.getContext('2d');
 ctx.save();ctx.fillStyle='rgba(0,0,0,.42)';ctx.fillRect(10,10,230,74);
 ctx.fillStyle='#fff';ctx.font='12px sans-serif';
 const w=S.weather||{};
 ctx.fillText('День '+S.day+'  '+Math.floor(S.minutes/60).toString().padStart(2,'0')+':'+Math.floor(S.minutes%60).toString().padStart(2,'0'),18,28);
 ctx.fillText('Погода: '+(w.type||'ясно')+'  '+Math.round(w.temp||0)+'°C',18,45);
 ctx.fillText('Здоровье '+Math.round(S.hp)+'  Вода '+Math.round(S.water)+'  Еда '+Math.round(S.food),18,62);
 ctx.fillText('История причин: '+((S.causes||[]).length),18,79);
 ctx.restore();
}
function bth13HUD(){
 const e=document.getElementById('bth13eco');
 if(e)e.textContent='Жизнь мира: растения '+(S.bio?.plantSeeds||0)+' · рождения '+(S.bio?.animalBirths||0)+' · потери '+(S.bio?.animalDeaths||0);
}


</script><button data-act="observe" onclick="bth11FieldObservation()">Исследовать</button><div id="bth13eco" style="position:fixed;left:10px;bottom:8px;padding:6px 9px;background:rgba(0,0,0,.45);color:#fff;font:12px system-ui;border-radius:8px;pointer-events:none">Жизнь мира</div><script>setInterval(bth13HUD,1000);</script><div id="bth30panel" style="position:fixed;right:8px;top:8px;z-index:20;padding:7px 9px;background:rgba(0,0,0,.48);color:#fff;font:11px system-ui;border-radius:8px;pointer-events:none">BTH 3.0</div>
<script>function bth30HUD(){const e=document.getElementById('bth30panel');if(!e)return;const s=BTH30.status();e.textContent='BTH 3.0 · День '+s.day+' · Животные '+s.animals+' · Растения '+s.plants+' · Открытия '+s.discoveries;}setInterval(bth30HUD,1000);bth30HUD();</script></body></html>
