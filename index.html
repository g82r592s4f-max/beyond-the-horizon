<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BEYOND THE HORIZON · CONTROL TEST</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101812;color:#eee;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:10px;top:10px;z-index:10;background:#000b;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45;pointer-events:none}
#status{font-weight:700}#coords{opacity:.85}#hint{opacity:.75}
#joy{position:fixed;left:24px;bottom:28px;width:154px;height:154px;border-radius:50%;background:#fff2;border:2px solid #fff6;z-index:20;touch-action:none;user-select:none;-webkit-user-select:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:#fff7;border:2px solid #fff9;pointer-events:none}
#pad{position:fixed;right:20px;bottom:30px;width:154px;height:154px;z-index:20;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:6px;touch-action:none}
.d{border:1px solid #fff5;border-radius:14px;background:#fff2;color:#fff;font-size:25px;font-weight:700;touch-action:none;user-select:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#right{grid-column:3;grid-row:2}#down{grid-column:2;grid-row:3}
#reset{position:fixed;right:12px;top:10px;z-index:30;padding:9px 12px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:700}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div id="status">УПРАВЛЕНИЕ: ожидаю касание</div><div id="coords">Игрок: 0.0 / 0.0</div><div id="hint">Проверь джойстик и стрелки справа</div></div>
<button id="reset">Сброс теста</button>
<div id="joy"><div id="knob"></div></div>
<div id="pad"><button class="d" id="up">▲</button><button class="d" id="left">◀</button><button class="d" id="right">▶</button><button class="d" id="down">▼</button></div>
<script>
"use strict";
const c=document.getElementById('game'),ctx=c.getContext('2d');
const statusEl=document.getElementById('status'),coordsEl=document.getElementById('coords');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize,{passive:true});resize();
const P={x:0,y:0}; let inputX=0,inputY=0,active=false,lastInput='нет';
function setInput(x,y,src){inputX=Math.max(-1,Math.min(1,x));inputY=Math.max(-1,Math.min(1,y));active=Math.abs(inputX)+Math.abs(inputY)>0;lastInput=src;statusEl.textContent=active?`УПРАВЛЕНИЕ: ${src} ✓`:`УПРАВЛЕНИЕ: касание зарегистрировано ✓`;draw()}
function clearInput(src){inputX=0;inputY=0;active=false;lastInput=src;statusEl.textContent=`ОТПУСКАНИЕ: ${src} ✓`}
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
let joyPointer=null;
function joyPoint(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.36,mag=Math.hypot(dx,dy)||1; if(mag>max){dx=dx/mag*max;dy=dy/mag*max}knob.style.transform=`translate(${dx}px,${dy}px)`;setInput(dx/max,dy/max,'ДЖОЙСТИК')}
joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture?.(e.pointerId);joyPoint(e);e.preventDefault()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){joyPoint(e);e.preventDefault()}});
function joyUp(e){if(e.pointerId===joyPointer){joyPointer=null;knob.style.transform='translate(0,0)';clearInput('ДЖОЙСТИК');e.preventDefault()}}
joy.addEventListener('pointerup',joyUp);joy.addEventListener('pointercancel',joyUp);joy.addEventListener('lostpointercapture',()=>{joyPointer=null;knob.style.transform='translate(0,0)'});
['touchstart','touchmove','touchend','touchcancel'].forEach(t=>joy.addEventListener(t,e=>e.preventDefault(),{passive:false}));
const keys={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
for(const [id,v] of Object.entries(keys)){
 const b=document.getElementById(id);
 const down=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);setInput(v[0],v[1],'КНОПКА '+id.toUpperCase())};
 const up=e=>{e.preventDefault();clearInput('КНОПКА '+id.toUpperCase())};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
 b.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});b.addEventListener('touchend',e=>e.preventDefault(),{passive:false});
}
addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k){e.preventDefault();setInput(...keys[k],'КЛАВИАТУРА')}});
addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key))clearInput('КЛАВИАТУРА')});
document.getElementById('reset').onclick=()=>{P.x=P.y=0;clearInput('СБРОС');};
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#17251c';ctx.fillRect(0,0,W,H);
 const scale=Math.min(W,H)/8,ox=W/2-P.x*scale,oy=H/2-P.y*scale;
 ctx.strokeStyle='#ffffff14';ctx.lineWidth=1;for(let x=-20;x<=20;x++){ctx.beginPath();ctx.moveTo(ox+x*scale,0);ctx.lineTo(ox+x*scale,H);ctx.stroke()}for(let y=-20;y<=20;y++){ctx.beginPath();ctx.moveTo(0,oy+y*scale);ctx.lineTo(W,oy+y*scale);ctx.stroke()}
 for(let x=-8;x<=8;x++)for(let y=-8;y<=8;y++){if((x*x+y*y)%7===0){ctx.fillStyle='#35553b';ctx.beginPath();ctx.arc(ox+x*scale,oy+y*scale,12,0,7);ctx.fill()}}
 ctx.fillStyle='#f4d35e';ctx.beginPath();ctx.arc(W/2,H/2,12,0,7);ctx.fill();
 coordsEl.textContent=`Игрок: ${P.x.toFixed(2)} / ${P.y.toFixed(2)} · Ввод: ${lastInput}`;
}
let last=performance.now();function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;if(active){P.x+=inputX*dt*2.2;P.y+=inputY*dt*2.2}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.onerror=(m,s,l,col,e)=>{statusEl.textContent='ОШИБКА JS: '+m;};
window.addEventListener('unhandledrejection',e=>{statusEl.textContent='ОШИБКА: '+e.reason});
</script></body></html>
